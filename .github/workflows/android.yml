name: Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create default environment configuration
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ -n "$TELEGRAM_API_ID" ]; then
            sed -i "s/^TELEGRAM_API_ID=.*/TELEGRAM_API_ID=$TELEGRAM_API_ID/" .env
          fi
          if [ -n "$TELEGRAM_API_HASH" ]; then
            sed -i "s/^TELEGRAM_API_HASH=.*/TELEGRAM_API_HASH=$TELEGRAM_API_HASH/" .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore for CI
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Validate Required Secrets
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ] || [ "$TELEGRAM_API_ID" = "0" ] || [ "$TELEGRAM_API_HASH" = "UNCONFIGURED" ]; then
            echo "::error::Missing required GitHub Secrets: TELEGRAM_API_ID / TELEGRAM_API_HASH"
            echo "Please configure TELEGRAM_API_ID and TELEGRAM_API_HASH under Settings -> Secrets and variables -> Actions -> Repository secrets"
            exit 1
          fi

      - name: Verify Build Credentials Status
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: ./gradlew :app:verifyTelegramCredentials --no-daemon

      - name: Run Unit Tests
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kawach-cloud-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Validate and Decode Release Keystore
        id: setup-release-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KAWACH_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KAWACH_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAWACH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAWACH_RELEASE_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$KEYSTORE_BASE64" ]; then
            MISSING_SECRETS="$MISSING_SECRETS KAWACH_RELEASE_KEYSTORE_BASE64"
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            MISSING_SECRETS="$MISSING_SECRETS KAWACH_RELEASE_STORE_PASSWORD"
          fi
          if [ -z "$KEY_ALIAS" ]; then
            MISSING_SECRETS="$MISSING_SECRETS KAWACH_RELEASE_KEY_ALIAS"
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            MISSING_SECRETS="$MISSING_SECRETS KAWACH_RELEASE_KEY_PASSWORD"
          fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "has_release_signing=false" >> $GITHUB_OUTPUT
            echo "::warning::Missing release signing secrets ($MISSING_SECRETS). Skipping signed release build."
            echo "To enable signed release APKs/AABs, add these secrets under Settings -> Secrets and variables -> Actions."
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.keystore"
            if [ -s "${{ github.workspace }}/release.keystore" ]; then
              echo "has_release_signing=true" >> $GITHUB_OUTPUT
              echo "Release keystore decoded successfully."
            else
              echo "has_release_signing=false" >> $GITHUB_OUTPUT
              echo "::warning::Decoded release keystore was empty. Skipping signed release build."
            fi
          fi

      - name: Build Release APK (Signed)
        if: steps.setup-release-keystore.outputs.has_release_signing == 'true'
        env:
          KAWACH_RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          KAWACH_RELEASE_STORE_PASSWORD: ${{ secrets.KAWACH_RELEASE_STORE_PASSWORD }}
          KAWACH_RELEASE_KEY_ALIAS: ${{ secrets.KAWACH_RELEASE_KEY_ALIAS }}
          KAWACH_RELEASE_KEY_PASSWORD: ${{ secrets.KAWACH_RELEASE_KEY_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Release Bundle (Signed AAB)
        if: steps.setup-release-keystore.outputs.has_release_signing == 'true'
        env:
          KAWACH_RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          KAWACH_RELEASE_STORE_PASSWORD: ${{ secrets.KAWACH_RELEASE_STORE_PASSWORD }}
          KAWACH_RELEASE_KEY_ALIAS: ${{ secrets.KAWACH_RELEASE_KEY_ALIAS }}
          KAWACH_RELEASE_KEY_PASSWORD: ${{ secrets.KAWACH_RELEASE_KEY_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Release Artifacts & Signing
        if: steps.setup-release-keystore.outputs.has_release_signing == 'true'
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected signed release APK ($APK_PATH) not found."
            exit 1
          fi

          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Expected release bundle ($AAB_PATH) not found."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Verifying APK signing with $APKSIGNER:"
            "$APKSIGNER" verify --verbose "$APK_PATH"
          else
            echo "apksigner tool not found; checking with jarsigner:"
            jarsigner -verify -verbose -certs "$APK_PATH"
          fi
          echo "Signed release APK and AAB verified successfully."

      - name: Clean up Release Keystore
        if: always()
        run: |
          rm -f "${{ github.workspace }}/release.keystore"
          rm -f "${{ github.workspace }}/app/release.keystore"

      - name: Upload Release APK Artifact
        if: steps.setup-release-keystore.outputs.has_release_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kawach-cloud-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Release Bundle Artifact
        if: steps.setup-release-keystore.outputs.has_release_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kawach-cloud-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
