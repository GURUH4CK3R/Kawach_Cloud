name: Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create default environment configuration
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Generate debug keystore for CI
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kawach-cloud-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Setup Release Keystore
        id: setup-release-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KAWACH_RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Release keystore decoded successfully."
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "::warning::KAWACH_RELEASE_KEYSTORE_BASE64 secret not found; build will generate unsigned release artifacts."
          fi

      - name: Build Release APK
        env:
          KAWACH_RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          KAWACH_RELEASE_STORE_PASSWORD: ${{ secrets.KAWACH_RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KAWACH_RELEASE_KEY_ALIAS: ${{ secrets.KAWACH_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KAWACH_RELEASE_KEY_PASSWORD: ${{ secrets.KAWACH_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KAWACH_RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAWACH_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAWACH_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release Bundle (AAB)
        env:
          KAWACH_RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          KAWACH_RELEASE_STORE_PASSWORD: ${{ secrets.KAWACH_RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KAWACH_RELEASE_KEY_ALIAS: ${{ secrets.KAWACH_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KAWACH_RELEASE_KEY_PASSWORD: ${{ secrets.KAWACH_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KAWACH_RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAWACH_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAWACH_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify Release Artifacts & Signing
        run: |
          echo "=== Checking Release Outputs ==="
          ls -la app/build/outputs/apk/release/ || true
          ls -la app/build/outputs/bundle/release/ || true

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$RELEASE_APK" ]; then
            echo "Found signed release APK: $RELEASE_APK"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              echo "Verifying APK signing with $APKSIGNER:"
              "$APKSIGNER" verify --verbose "$RELEASE_APK"
            fi
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "::warning::Only unsigned APK found (app-release-unsigned.apk). Set repository secrets KAWACH_RELEASE_KEYSTORE_BASE64, KAWACH_RELEASE_STORE_PASSWORD, KAWACH_RELEASE_KEY_ALIAS, and KAWACH_RELEASE_KEY_PASSWORD to build a signed release."
          fi

      - name: Clean up Release Keystore
        if: always()
        run: |
          rm -f release.keystore
          rm -f app/release.keystore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kawach-cloud-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kawach-cloud-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
