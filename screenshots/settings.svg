<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" width="1080" height="2400">
  <defs>
    <linearGradient id="setBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="60%" stop-color="#091424"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="setCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112238"/>
      <stop offset="100%" stop-color="#0E1B2E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="2400" fill="url(#setBg)" rx="72"/>

  <!-- Status Bar -->
  <text x="80" y="90" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="34" font-weight="600">9:41</text>
  <circle cx="940" cy="80" r="14" fill="#94A3B8"/>
  <rect x="970" y="70" width="36" height="20" rx="6" fill="#94A3B8"/>

  <!-- Top App Bar -->
  <g transform="translate(60, 180)">
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="44" font-weight="800">Settings</text>
    <text x="0" y="80" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24">Preferences &amp; Account</text>
  </g>

  <!-- Telegram Account Card -->
  <g transform="translate(60, 300)">
    <rect width="960" height="280" rx="32" fill="url(#setCardGrad)" stroke="#1E293B" stroke-width="2"/>
    <!-- Avatar Placeholder -->
    <rect x="40" y="40" width="100" height="100" rx="50" fill="#0284C7" fill-opacity="0.25"/>
    <text x="90" y="105" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="44" font-weight="bold">KC</text>
    
    <!-- User Info -->
    <text x="170" y="80" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="34" font-weight="700">Kawach User</text>
    <text x="170" y="120" fill="#34D399" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="600">● Connected to Telegram Saved Messages</text>

    <!-- Disconnect Button -->
    <g transform="translate(40, 170)">
      <rect width="880" height="76" rx="20" fill="#7F1D1D" fill-opacity="0.3" stroke="#DC2626" stroke-width="1.5"/>
      <text x="440" y="48" text-anchor="middle" fill="#F87171" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="700">Disconnect Telegram Account</text>
    </g>
  </g>

  <!-- Theme Mode Selector Card -->
  <g transform="translate(60, 620)">
    <rect width="960" height="260" rx="32" fill="url(#setCardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="40" y="60" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="700">Appearance &amp; Theme</text>
    <text x="40" y="95" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="22">Material 3 Dynamic System</text>

    <!-- 3 Theme Options -->
    <g transform="translate(40, 130)">
      <!-- System Default -->
      <rect width="280" height="85" rx="22" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="140" y="52" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="600">System</text>

      <!-- Dark Theme (Active) -->
      <rect x="300" width="280" height="85" rx="22" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="2"/>
      <text x="440" y="52" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="700">🌙 Dark</text>

      <!-- Light Theme -->
      <rect x="600" width="280" height="85" rx="22" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="740" y="52" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="600">☀️ Light</text>
    </g>
  </g>

  <!-- Storage Cache Stats Card -->
  <g transform="translate(60, 920)">
    <rect width="960" height="220" rx="32" fill="url(#setCardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="40" y="60" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="700">Local Cache &amp; Storage</text>
    <text x="40" y="100" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24">Cached previews: 14.2 MB • Database: 320 KB</text>

    <!-- Clear Cache Button -->
    <g transform="translate(40, 135)">
      <rect width="420" height="60" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="210" y="40" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="600">Clear Preview Cache</text>
    </g>
  </g>

  <!-- App Info Card -->
  <g transform="translate(60, 1180)">
    <rect width="960" height="300" rx="32" fill="url(#setCardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="40" y="60" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="700">About Kawach Cloud</text>
    <text x="40" y="105" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="600">Version 1.0.0-alpha01 (Build 1)</text>
    <text x="40" y="145" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="22">Developer: Aravind(guru)</text>
    <text x="40" y="185" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="22">License: Apache 2.0 Open Source</text>
    <text x="40" y="240" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="20">Not affiliated with or endorsed by Telegram FZ-LLC</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 2180)">
    <rect width="1080" height="220" fill="#0B1320" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="180" cy="65" r="16" fill="#64748B"/>
    <text x="180" y="145" text-anchor="middle" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="500">Home</text>

    <circle cx="540" cy="65" r="16" fill="#64748B"/>
    <text x="540" y="145" text-anchor="middle" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="500">Files</text>

    <!-- Active Settings Nav -->
    <rect x="840" y="30" width="120" height="70" rx="35" fill="#0284C7" fill-opacity="0.25"/>
    <circle cx="900" cy="65" r="16" fill="#38BDF8"/>
    <text x="900" y="145" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="700">Settings</text>
    
    <rect x="390" y="195" width="300" height="8" rx="4" fill="#475569"/>
  </g>
</svg>
