<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" width="1080" height="2400">
  <defs>
    <linearGradient id="upBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="60%" stop-color="#091424"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="upCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112238"/>
      <stop offset="100%" stop-color="#0E1B2E"/>
    </linearGradient>
    <linearGradient id="upBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="2400" fill="url(#upBg)" rx="72"/>

  <!-- Status Bar -->
  <text x="80" y="90" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="34" font-weight="600">9:41</text>
  <circle cx="940" cy="80" r="14" fill="#94A3B8"/>
  <rect x="970" y="70" width="36" height="20" rx="6" fill="#94A3B8"/>

  <!-- Top App Bar -->
  <g transform="translate(60, 180)">
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="44" font-weight="800">Upload Transfers</text>
    <text x="0" y="80" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="24">Multi-File Sequential Queue</text>
  </g>

  <!-- Active Queue Summary Banner -->
  <g transform="translate(60, 300)">
    <rect width="960" height="200" rx="32" fill="#13233A" stroke="#0284C7" stroke-width="2.5"/>
    <text x="40" y="65" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="32" font-weight="800">Uploading 2 of 4 files (68%)</text>
    <text x="40" y="105" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24">nature_hike_raw.mp4 • 48.2 MB</text>
    
    <!-- Progress Bar Track -->
    <rect x="40" y="135" width="880" height="20" rx="10" fill="#0B1320"/>
    <rect x="40" y="135" width="600" height="20" rx="10" fill="url(#upBarGrad)"/>

    <!-- Cancel Queue Button -->
    <circle cx="890" cy="80" r="26" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="890" y="89" text-anchor="middle" fill="#EF4444" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="bold">✕</text>
  </g>

  <!-- Section Header -->
  <g transform="translate(60, 560)">
    <text x="0" y="0" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="700">Queue Items</text>
  </g>

  <!-- Queue Item 1: Uploading Now -->
  <g transform="translate(60, 600)">
    <rect width="960" height="170" rx="28" fill="#112238" stroke="#0284C7" stroke-width="2"/>
    <rect x="30" y="30" width="110" height="110" rx="22" fill="#F97316" fill-opacity="0.2"/>
    <text x="85" y="95" text-anchor="middle" fill="#FB923C" font-family="-apple-system, Roboto, sans-serif" font-size="40" font-weight="bold">VID</text>
    
    <text x="170" y="65" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="700">nature_hike_raw.mp4</text>
    <text x="170" y="102" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="600">Uploading 68% • 32.8 MB / 48.2 MB</text>
    
    <rect x="170" y="125" width="680" height="10" rx="5" fill="#0B1320"/>
    <rect x="170" y="125" width="460" height="10" rx="5" fill="#38BDF8"/>

    <circle cx="900" cy="85" r="22" fill="#1E293B"/>
    <text x="900" y="93" text-anchor="middle" fill="#EF4444" font-family="-apple-system, Roboto, sans-serif" font-size="20">✕</text>
  </g>

  <!-- Queue Item 2: Completed -->
  <g transform="translate(60, 800)">
    <rect width="960" height="150" rx="28" fill="url(#upCardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="30" y="25" width="100" height="100" rx="20" fill="#0284C7" fill-opacity="0.2"/>
    <text x="80" y="85" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="36" font-weight="bold">IMG</text>
    
    <text x="160" y="65" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="700">summit_view.jpg</text>
    <text x="160" y="105" fill="#34D399" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="600">✓ Uploaded to Saved Messages (4.2 MB)</text>
    
    <rect x="800" y="50" width="120" height="50" rx="14" fill="#065F46" fill-opacity="0.3"/>
    <text x="860" y="83" text-anchor="middle" fill="#34D399" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="700">DONE</text>
  </g>

  <!-- Queue Item 3: Queued -->
  <g transform="translate(60, 980)">
    <rect width="960" height="150" rx="28" fill="url(#upCardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="30" y="25" width="100" height="100" rx="20" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="80" y="85" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="36" font-weight="bold">PDF</text>
    
    <text x="160" y="65" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="700">project_specs.pdf</text>
    <text x="160" y="105" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24">Waiting in queue... • 1.8 MB</text>
    
    <rect x="800" y="50" width="120" height="50" rx="14" fill="#1E293B"/>
    <text x="860" y="83" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="600">QUEUED</text>
  </g>

  <!-- Queue Item 4: Queued -->
  <g transform="translate(60, 1160)">
    <rect width="960" height="150" rx="28" fill="url(#upCardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="30" y="25" width="100" height="100" rx="20" fill="#A855F7" fill-opacity="0.2"/>
    <text x="80" y="85" text-anchor="middle" fill="#C084FC" font-family="-apple-system, Roboto, sans-serif" font-size="36" font-weight="bold">ZIP</text>
    
    <text x="160" y="65" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="700">source_code_snapshot.zip</text>
    <text x="160" y="105" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24">Waiting in queue... • 18.5 MB</text>
    
    <rect x="800" y="50" width="120" height="50" rx="14" fill="#1E293B"/>
    <text x="860" y="83" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="600">QUEUED</text>
  </g>

  <!-- Upload Architecture Note -->
  <g transform="translate(60, 1370)">
    <rect width="960" height="140" rx="26" fill="#0A1627" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="40" y="55" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="700">🔒 Direct MTProto Upload</text>
    <text x="40" y="95" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="22">Files are uploaded directly to Telegram servers with zero third-party proxy.</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 2180)">
    <rect width="1080" height="220" fill="#0B1320" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="180" cy="65" r="16" fill="#64748B"/>
    <text x="180" y="145" text-anchor="middle" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="500">Home</text>

    <rect x="480" y="30" width="120" height="70" rx="35" fill="#0284C7" fill-opacity="0.25"/>
    <circle cx="540" cy="65" r="16" fill="#38BDF8"/>
    <text x="540" y="145" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="700">Files</text>

    <circle cx="900" cy="65" r="16" fill="#64748B"/>
    <text x="900" y="145" text-anchor="middle" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="500">Settings</text>
    
    <rect x="390" y="195" width="300" height="8" rx="4" fill="#475569"/>
  </g>
</svg>
