<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" width="1080" height="2400">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="vidSceneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="playBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="2400" fill="url(#vidBg)" rx="72"/>

  <!-- Status Bar -->
  <text x="80" y="90" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="34" font-weight="600">9:41</text>
  <circle cx="940" cy="80" r="14" fill="#94A3B8"/>
  <rect x="970" y="70" width="36" height="20" rx="6" fill="#94A3B8"/>

  <!-- Top App Bar -->
  <g transform="translate(60, 180)">
    <!-- Back Button -->
    <rect width="70" height="70" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="35" y="47" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="36">‹</text>

    <!-- File Title & Details -->
    <text x="100" y="40" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="36" font-weight="700">product_intro_4k.mp4</text>
    <text x="100" y="72" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24">124 MB • Video • ExoPlayer Engine</text>

    <!-- Download Icon Button -->
    <rect x="800" width="70" height="70" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="835" y="46" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="28">↓</text>

    <!-- Share Icon Button -->
    <rect x="890" width="70" height="70" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="925" y="46" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="28">↗</text>
  </g>

  <!-- Video Viewport -->
  <g transform="translate(60, 480)">
    <!-- 16:9 Video Canvas -->
    <rect width="960" height="1100" rx="36" fill="url(#vidSceneGrad)" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Central Video Play Controls -->
    <!-- 10s Replay Button -->
    <g transform="translate(240, 550)">
      <circle r="46" fill="#0B1320" fill-opacity="0.8" stroke="#334155" stroke-width="2"/>
      <text x="0" y="10" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="bold">↺ 10s</text>
    </g>

    <!-- Center Play/Pause Button -->
    <g transform="translate(480, 550)">
      <circle r="70" fill="url(#playBtnGrad)" stroke="#38BDF8" stroke-width="3"/>
      <!-- Pause Bars -->
      <rect x="-24" y="-30" width="16" height="60" rx="8" fill="#FFFFFF"/>
      <rect x="8" y="-30" width="16" height="60" rx="8" fill="#FFFFFF"/>
    </g>

    <!-- 10s Forward Button -->
    <g transform="translate(720, 550)">
      <circle r="46" fill="#0B1320" fill-opacity="0.8" stroke="#334155" stroke-width="2"/>
      <text x="0" y="10" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="bold">10s ↻</text>
    </g>

    <!-- Video Scrubber Overlay Bar -->
    <g transform="translate(40, 960)">
      <!-- Scrubber Track -->
      <rect width="880" height="14" rx="7" fill="#334155"/>
      <!-- Scrubber Played Progress -->
      <rect width="360" height="14" rx="7" fill="#0284C7"/>
      <!-- Scrubber Thumb -->
      <circle cx="360" cy="7" r="14" fill="#38BDF8"/>
      
      <!-- Timestamp Readout -->
      <text x="0" y="60" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="600">01:24 / 04:15</text>
      
      <!-- Controls Right: Mute & Fullscreen -->
      <text x="760" y="60" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="700">🔊 UNMUTE</text>
      <text x="850" y="60" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="28">⛶</text>
    </g>
  </g>

  <!-- Player Info Card -->
  <g transform="translate(60, 1680)">
    <rect width="960" height="200" rx="28" fill="#0E1A2C" stroke="#1E293B" stroke-width="1.5"/>
    <text x="40" y="60" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="700">AndroidX Media3 (ExoPlayer)</text>
    <text x="40" y="100" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24">Zero memory-overhead chunk streaming directly from TDLib</text>
    <text x="40" y="145" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="600">Supports: MP4, MKV, WebM, MOV, AVI</text>
  </g>

  <!-- Home Indicator -->
  <rect x="390" y="2350" width="300" height="10" rx="5" fill="#475569"/>
</svg>
