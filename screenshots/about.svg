<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" width="1080" height="2400">
  <defs>
    <linearGradient id="abtBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0A182C"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="abtCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112238"/>
      <stop offset="100%" stop-color="#0D1B2D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="2400" fill="url(#abtBg)" rx="72"/>

  <!-- Status Bar -->
  <text x="80" y="90" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="34" font-weight="600">9:41</text>
  <circle cx="940" cy="80" r="14" fill="#94A3B8"/>
  <rect x="970" y="70" width="36" height="20" rx="6" fill="#94A3B8"/>

  <!-- Top App Bar -->
  <g transform="translate(60, 180)">
    <text x="0" y="44" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="44" font-weight="800">About Kawach Cloud</text>
  </g>

  <!-- Central Shield Logo Card -->
  <g transform="translate(540, 480)">
    <circle cx="0" cy="0" r="110" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="3"/>
    <!-- Shield Graphic -->
    <path d="M 0 -60 L 52 -36 C 52 24, 30 68, 0 84 C -30 68, -52 24, -52 -36 Z" fill="#0284C7"/>
    <path d="M -22 15 A 14 14 0 0 1 -9 -4 A 20 20 0 0 1 18 -2 A 14 14 0 0 1 26 15 Z" fill="#F97316"/>
    
    <text x="0" y="180" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="54" font-weight="800">Kawach Cloud</text>
    <text x="0" y="230" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="600">Version 1.0.0-alpha01 • Build 1</text>
    <text x="0" y="275" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="24">Your personal cloud. Powered by Telegram.</text>
  </g>

  <!-- Developer Profile Card -->
  <g transform="translate(60, 880)">
    <rect width="960" height="320" rx="32" fill="url(#abtCard)" stroke="#1E293B" stroke-width="2"/>
    <text x="50" y="60" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="700">Developer Information</text>
    
    <!-- Developer Name -->
    <text x="50" y="120" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="36" font-weight="800">ARAVIND (GURU)</text>
    <text x="50" y="160" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="500">Android Engineer &amp; Open Source Author</text>

    <!-- Contact Row Badges -->
    <g transform="translate(50, 200)">
      <!-- Email Badge -->
      <rect width="400" height="60" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="25" y="40" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="22">📧 darkwebaccess404@gmail.com</text>

      <!-- Telegram Badge -->
      <rect x="430" width="220" height="60" rx="16" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1.5"/>
      <text x="455" y="40" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="22">💬 @DaRkAcCeSs</text>

      <!-- GitHub Badge -->
      <rect x="670" width="210" height="60" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="695" y="40" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="22">🐙 GURUH4CK3R</text>
    </g>
  </g>

  <!-- Open Source License Card -->
  <g transform="translate(60, 1240)">
    <rect width="960" height="260" rx="32" fill="url(#abtCard)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="50" y="60" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="700">License &amp; Open Source</text>
    <text x="50" y="110" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="600">Apache License 2.0</text>
    <text x="50" y="150" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="22">Free, transparent, and completely client-side open source.</text>
    <text x="50" y="195" fill="#34D399" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="600">✓ No telemetry • No ads • No third-party data collection</text>
  </g>

  <!-- Telegram Disclaimer Card -->
  <g transform="translate(60, 1540)">
    <rect width="960" height="200" rx="28" fill="#0A1627" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="50" y="60" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="700">Telegram Affiliation Disclaimer</text>
    <text x="50" y="105" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="22">Kawach Cloud is an independent project and is not affiliated with,</text>
    <text x="50" y="140" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="22">endorsed by, sponsored by, or officially connected to Telegram.</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 2180)">
    <rect width="1080" height="220" fill="#0B1320" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="180" cy="65" r="16" fill="#64748B"/>
    <text x="180" y="145" text-anchor="middle" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="500">Home</text>

    <circle cx="540" cy="65" r="16" fill="#64748B"/>
    <text x="540" y="145" text-anchor="middle" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="500">Files</text>

    <rect x="840" y="30" width="120" height="70" rx="35" fill="#0284C7" fill-opacity="0.25"/>
    <circle cx="900" cy="65" r="16" fill="#38BDF8"/>
    <text x="900" y="145" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="26" font-weight="700">Settings</text>
    
    <rect x="390" y="195" width="300" height="8" rx="4" fill="#475569"/>
  </g>
</svg>
