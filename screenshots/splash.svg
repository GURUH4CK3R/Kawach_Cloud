<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" width="1080" height="2400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B192C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14263E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F1D30" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#0284C7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="2400" fill="url(#bgGrad)" rx="72"/>

  <!-- Radial Glow Behind Shield -->
  <circle cx="540" cy="1080" r="460" fill="url(#glowGrad)"/>

  <!-- Status Bar -->
  <text x="80" y="90" fill="#94A3B8" font-family="-apple-system, Roboto, sans-serif" font-size="34" font-weight="600">9:41</text>
  <circle cx="940" cy="80" r="14" fill="#94A3B8"/>
  <rect x="970" y="70" width="36" height="20" rx="6" fill="#94A3B8"/>

  <!-- Logo Container (Glass Card) -->
  <g transform="translate(540, 1040)" filter="url(#dropGlow)">
    <rect x="-140" y="-140" width="280" height="280" rx="70" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
    
    <!-- Shield Icon -->
    <path d="M 0 -80 L 70 -50 C 70 30, 40 85, 0 105 C -40 85, -70 30, -70 -50 Z" fill="#0284C7"/>
    <path d="M 0 -72 L 60 -45 C 60 25, 34 75, 0 92 C -34 75, -60 25, -60 -45 Z" fill="#0369A1"/>
    
    <!-- Cloud Icon Inside Shield -->
    <path d="M -30 20 A 18 18 0 0 1 -12 -5 A 26 26 0 0 1 24 -2 A 18 18 0 0 1 34 20 Z" fill="#F97316"/>
  </g>

  <!-- App Title -->
  <text x="540" y="1320" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, Roboto, sans-serif" font-size="76" font-weight="800" letter-spacing="2">Kawach Cloud</text>

  <!-- Tagline Badge -->
  <g transform="translate(540, 1400)">
    <circle cx="-210" cy="-12" r="10" fill="#F97316"/>
    <text x="0" y="0" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, Roboto, sans-serif" font-size="36" font-weight="600">Secure Telegram Backend Storage</text>
  </g>

  <!-- Developer Card -->
  <g transform="translate(540, 1540)">
    <rect x="-190" y="-36" width="380" height="72" rx="36" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="700">Developer: ARAVIND (GURU)</text>
  </g>

  <!-- App Version & Status -->
  <text x="540" y="2220" text-anchor="middle" fill="#64748B" font-family="-apple-system, Roboto, sans-serif" font-size="30" font-weight="600">Version 1.0.0-alpha01 • Build 1</text>
  
  <!-- Subtle Home Indicator -->
  <rect x="390" y="2350" width="300" height="10" rx="5" fill="#475569"/>
</svg>
